server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: cardamom-ledger-backend
  profiles:
    active: dev

  # Default Local Profile using In-Memory H2 with PostgreSQL Compatibility Mode
  datasource:
    url: jdbc:h2:mem:cardamom_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost,http://localhost,http://localhost:5173,capacitor://localhost}
  auth:
    enabled: ${APP_AUTH_ENABLED:true}
    username: ${APP_AUTH_USERNAME:ajith@highlandestate.com}
    password: ${APP_AUTH_PASSWORD:cardamom2026}
    name: ${APP_AUTH_NAME:Ajith Nair}
    role: ${APP_AUTH_ROLE:Estate General Manager}
    estate: ${APP_AUTH_ESTATE:Highland Cardamom Valley, Idukki}
    jwt-secret: ${APP_AUTH_JWT_SECRET:}
    token-expiration-hours: ${APP_AUTH_TOKEN_HOURS:720}

logging:
  level:
    root: INFO
    com.cardamom.ledger: DEBUG
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
